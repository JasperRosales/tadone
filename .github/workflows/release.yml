name: Build Windows installer

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build MSI + EXE
        run: ./gradlew packageMsi packageExe -PappVersion=${{ env.APP_VERSION }} --no-daemon
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: Tadone-${{ env.APP_VERSION }}
          path: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Tadone ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          body: |
            Automated build of `${{ github.ref_name }}` @ ${{ github.sha }}.
            Download **Tadone-${{ env.APP_VERSION }}.msi** (or the .exe) and run it to install.
          files: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
